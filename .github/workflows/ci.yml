name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Sync dependencies
        run: uv sync
      - name: Pre-commit
        run: uv run pre-commit run --all-files
      - name: Tests
        run: uv run pytest
      - name: RAG tests
        run: uv run --project rag-service pytest -c rag-service/pyproject.toml rag-service/tests
      - name: Agent service tests
        run: uv run --project agent-service pytest -c agent-service/pyproject.toml agent-service/tests
      - name: Search service tests
        run: uv run --project search-service pytest -c search-service/pyproject.toml search-service/tests
