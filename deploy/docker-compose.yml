services:
  qdrant:
    image: qdrant/qdrant:v1.16.3
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  rag-service:
    build:
      context: ..
      dockerfile: rag-service/Dockerfile
    restart: unless-stopped
    env_file:
      - ../rag-service/.env
    environment:
      RAG_GIGACHAT_CA_BUNDLE: /config/russian_trusted_root_ca.pem
      FASTEMBED_CACHE_PATH: /app/.cache/fastembed
      RAG_QDRANT_DOCUMENTS_COLLECTION: ${RAG_QDRANT_DOCUMENTS_COLLECTION:-ai_scrivener_documents_current}
      RAG_QDRANT_EXAMPLES_COLLECTION: ${RAG_QDRANT_EXAMPLES_COLLECTION:-ai_scrivener_examples_current}
      RAG_PDF_CACHE_DIR: /app/.cache/pdf
      RAG_PDF_PUBLIC_BASE_URL: ${RAG_PDF_PUBLIC_BASE_URL:-http://127.0.0.1:8080}
    volumes:
      - fastembed_cache:/app/.cache/fastembed
      - rag_pdf_cache:/app/.cache/pdf
      - ${RAG_CORPUS_DIR_HOST:-/home/igorvolk/1C/ai_scrivener_corpus}:/corpus:ro
    depends_on:
      - qdrant
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')
      interval: 30s
      timeout: 10s
      retries: 3

  agent-service:
    build:
      context: ..
      dockerfile: agent-service/Dockerfile
    restart: unless-stopped
    env_file:
      - ../agent-service/.env
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')
      interval: 30s
      timeout: 10s
      retries: 3

  search-service:
    build:
      context: ..
      dockerfile: search-service/Dockerfile
    restart: unless-stopped
    env_file:
      - ../search-service/.env
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health')
      interval: 30s
      timeout: 10s
      retries: 3

  rag-indexer:
    profiles: ["indexer"]
    build:
      context: ..
      dockerfile: rag-service/Dockerfile.indexer
      args:
        WITH_PADDLE: ${RAG_INDEXER_WITH_PADDLE:-0}
    env_file:
      - ../rag-service/.env
    environment:
      RAG_URL: http://rag-service:8080
    volumes:
      - ${RAG_CORPUS_DIR_HOST:-/home/igorvolk/1C/ai_scrivener_corpus}:/corpus:ro
      - rag_index_cache:/cache
      - rag_index_state:/state
      - paddle_cache:/root/.paddlex
    command:
      - index
      - --corpus-dir
      - /corpus
      - --rag-url
      - http://rag-service:8080
      - --cache-dir
      - /cache
      - --state
      - /state/index-state.json
      - --ocr
      - ${RAG_INDEXER_OCR:-none}
    depends_on:
      rag-service:
        condition: service_healthy
    restart: "no"

volumes:
  qdrant_data:
  fastembed_cache:
  rag_pdf_cache:
  rag_index_cache:
  rag_index_state:
  paddle_cache:
