<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#445566"/>
  </marker>
</defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="800" y="70" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="30" font-weight="bold" fill="#16324F">Один шаг — одно решение: поиск, действие, контроль</text>

<g font-family="DejaVu Sans, Arial">
  <rect x="30" y="250" width="190" height="130" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
  <text x="125" y="295" text-anchor="middle" font-size="22" font-weight="bold" fill="#0D47A1">Задача</text>
  <text x="125" y="330" text-anchor="middle" font-size="17" fill="#1F2A36">от ДЛ</text>

  <rect x="250" y="250" width="190" height="130" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
  <text x="345" y="292" text-anchor="middle" font-size="20" font-weight="bold" fill="#1B5E20">Гибридный</text>
  <text x="345" y="320" text-anchor="middle" font-size="20" font-weight="bold" fill="#1B5E20">поиск</text>
  <text x="345" y="350" text-anchor="middle" font-size="16" fill="#1F2A36">цитаты</text>

  <rect x="470" y="250" width="190" height="130" rx="12" fill="#FFF3E0" stroke="#E67E22" stroke-width="2.5"/>
  <text x="565" y="292" text-anchor="middle" font-size="20" font-weight="bold" fill="#8A4B12">Шаг агента</text>
  <text x="565" y="322" text-anchor="middle" font-size="16" fill="#1F2A36">agent-service</text>

  <rect x="690" y="250" width="190" height="130" rx="12" fill="#FFF3E0" stroke="#E67E22" stroke-width="2.5"/>
  <text x="785" y="292" text-anchor="middle" font-size="20" font-weight="bold" fill="#8A4B12">Инструмент</text>
  <text x="785" y="322" text-anchor="middle" font-size="16" fill="#1F2A36">allowlist</text>

  <rect x="910" y="250" width="190" height="130" rx="12" fill="#FFFDE7" stroke="#F9A825" stroke-width="3"/>
  <text x="1005" y="292" text-anchor="middle" font-size="18" font-weight="bold" fill="#7A5A00">Approval,</text>
  <text x="1005" y="320" text-anchor="middle" font-size="17" font-weight="bold" fill="#7A5A00">если меняет</text>

  <rect x="1130" y="250" width="190" height="130" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
  <text x="1225" y="292" text-anchor="middle" font-size="20" font-weight="bold" fill="#1B5E20">Действие</text>
  <text x="1225" y="322" text-anchor="middle" font-size="16" fill="#1F2A36">в 1С</text>

  <rect x="1350" y="250" width="210" height="130" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
  <text x="1455" y="292" text-anchor="middle" font-size="20" font-weight="bold" fill="#0D47A1">История</text>
  <text x="1455" y="322" text-anchor="middle" font-size="16" fill="#1F2A36">кто · что · итог</text>
</g>

<g stroke="#445566" stroke-width="2.5" marker-end="url(#a)">
  <line x1="220" y1="315" x2="245" y2="315"/>
  <line x1="440" y1="315" x2="465" y2="315"/>
  <line x1="660" y1="315" x2="685" y2="315"/>
  <line x1="880" y1="315" x2="905" y2="315"/>
  <line x1="1100" y1="315" x2="1125" y2="315"/>
  <line x1="1320" y1="315" x2="1345" y2="315"/>
</g>

<path d="M 1455 380 L 1455 500 L 565 500 L 565 385" fill="none" stroke="#0F9D58" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#a)"/>
<text x="1010" y="535" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="18" fill="#0F7A45">следующий шаг: результат возвращается агенту</text>

<text x="800" y="650" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="22" fill="#1F2A36">LLM предлагает шаг — 1С проверяет allowlist, аргументы и право на действие</text>
<text x="800" y="700" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="19" fill="#5A6B7B">Комментарий при одобрении не пересылается; для указаний используется отклонение</text>
<text x="800" y="750" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="19" fill="#5A6B7B">Повторный вызов с тем же ключом возвращает сохранённый результат</text>
<text x="800" y="795" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="18" fill="#0F7A45">Чтение и поиск выполняются без approval; контроль — только для изменяющих действий</text>
</svg>
