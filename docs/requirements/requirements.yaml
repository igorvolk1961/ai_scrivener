meta:
  version: 1
  updated: "2026-10-21"
  source_of_truth: docs/requirements/requirements.yaml
requirements:
  - id: FR-001
    type: functional
    title: Управление должностными лицами и назначениями
    description: >-
      Система ведёт справочник должностных лиц, справочник должностей и регистр
      назначений, позволяя одному ДЛ занимать несколько должностей с датами начала
      и окончания.
    priority: must
    approval: approved
    source:
      - docs/raw_specification.md#4.1.1
      - docs/raw_specification.md#4.1.2
      - docs/raw_specification.md#4.1.3
    acceptance:
      - ДЛ можно назначить на одну или несколько должностей с датами.
      - История назначений сохраняется.
      - Неактивные ДЛ и должности не участвуют в новых назначениях.
    design:
      - docs/implementation_plan.md#5.2
      - docs/implementation_plan.md#5.4
    implementation:
      - src/Configuration/Catalogs/ДолжностныеЛица
      - src/Configuration/Catalogs/Должности
      - src/Configuration/InformationRegisters/НазначенияДолжностей
    tests:
      - TEST-FR-001-01
    test_files:
      - tests/1c/test_assignments.md
    status: planned
  - id: FR-002
    type: functional
    title: Иерархия должностей и вышестоящее ДЛ
    description: >-
      Должности образуют иерархию произвольной глубины; система определяет
      вышестоящее ДЛ для эскалации и адресации докладов.
    priority: must
    approval: approved
    source:
      - docs/raw_specification.md#4.1.2
    acceptance:
      - Поддерживается иерархия должностей произвольной глубины.
      - Для активной должности определяется вышестоящая должность и её ДЛ.
      - Циклы в иерархии запрещены.
    design:
      - docs/implementation_plan.md#5.2
      - docs/implementation_plan.md#5.7
    implementation:
      - src/Configuration/Catalogs/Должности
      - src/Configuration/CommonModules/ПользователиИПрава
    tests:
      - TEST-FR-002-01
    test_files:
      - tests/1c/test_hierarchy.md
    status: planned
  - id: FR-003
    type: functional
    title: Должностные обязанности с версионностью
    description: >-
      Обязанности хранятся с версией и датой утверждения, привязываются к паре
      «тип триггера — тип действия» и определяют требуемую реакцию.
    priority: must
    approval: approved
    source:
      - docs/raw_specification.md#4.1.4
    acceptance:
      - История версий обязанностей сохраняется.
      - Обязанность привязана к должности и паре типов.
      - Для пары можно определить приоритетное правило.
    design:
      - docs/implementation_plan.md#5.2
    implementation:
      - src/Configuration/Catalogs/ДолжностныеОбязанности
    tests:
      - TEST-FR-003-01
    test_files:
      - tests/1c/test_obligations.md
    status: planned
  - id: FR-004
    type: functional
    title: Шаблоны документов и метаданные плейсхолдеров
    description: >-
      Шаблон содержит текст с плейсхолдерами вида {{Имя}} и табличную часть с
      описанием типа, обязательности, источника и способа заполнения каждого
      плейсхолдера.
    priority: must
    approval: approved
    source:
      - docs/raw_specification.md#4.2.1
    acceptance:
      - Плейсхолдеры в тексте и табличной части синхронизированы.
      - Для плейсхолдера заданы тип, обязательность и источник.
      - Шаблон имеет версию и признак активности.
    design:
      - docs/implementation_plan.md#5.2
      - docs/implementation_plan.md#6.3
    implementation:
      - src/Configuration/Catalogs/ШаблоныДокументов
    tests:
      - TEST-FR-004-01
      - TEST-FR-004-02
    test_files:
      - tests/1c/test_template_placeholders.md
    status: planned
  - id: FR-005
    type: functional
    title: Расширяемые типы триггеров, действий и документов
    description: >-
      Предопределённые типы триггеров, действий и документов доступны из коробки;
      администратор может добавлять новые типы без изменения кода.
    priority: must
    approval: approved
    source:
      - docs/raw_specification.md#4.2.2
      - docs/raw_specification.md#4.3.1
      - docs/raw_specification.md#4.3.2
    acceptance:
      - Все шесть типов триггеров и шесть типов действий предопределены.
      - Новые типы можно добавить через справочник.
      - Неактивные типы не используются в новых задачах.
    design:
      - docs/implementation_plan.md#5.2
    implementation:
      - src/Configuration/Catalogs/ТипыТриггеров
      - src/Configuration/Catalogs/ТипыДействий
      - src/Configuration/Catalogs/ТипыДокументов
    tests:
      - TEST-FR-005-01
    test_files:
      - tests/1c/test_types.md
    status: planned
  - id: FR-006
    type: functional
    title: Нормативные сроки и ручное переопределение
    description: >-
      Нормативные сроки задаются по паре «тип триггера — тип действия» и могут
      быть переопределены вручную при постановке задачи.
    priority: must
    approval: approved
    source:
      - docs/raw_specification.md#4.3.3
    acceptance:
      - Для пары типов хранится нормативное время.
      - Задача получает срок из норматива или ручного переопределения.
      - Изменение норматива не меняет уже созданные задачи.
    design:
      - docs/implementation_plan.md#5.4
    implementation:
      - src/Configuration/InformationRegisters/НормативныеСроки
      - src/Configuration/CommonModules/ОркестраторЗадач
    tests:
      - TEST-FR-006-01
    test_files:
      - tests/1c/test_deadlines.md
    status: planned
  - id: FR-007
    type: functional
    title: Расписание таймеров
    description: >-
      Администратор задаёт cron-подобное расписание, привязку к ДЛ или должности и
      тип действия; регламентное задание создаёт триггеры по расписанию.
    priority: must
    approval: approved
    source:
      - docs/raw_specification.md#4.3.4
    acceptance:
      - Расписание хранится в справочнике или документе.
      - Регламентное задание создаёт не более одного триггера на срабатывание.
      - Следующий запуск рассчитывается и сохраняется.
    design:
      - docs/implementation_plan.md#5.3
      - docs/implementation_plan.md#10
    implementation:
      - src/Configuration/Documents/РасписаниеТаймеров
      - src/Configuration/ScheduledJobs/ГенерацияТриггеровПоТаймеру
    tests:
      - TEST-FR-007-01
    test_files:
      - tests/1c/test_timers.md
    status: planned
  - id: FR-008
    type: functional
    title: Входящий документ создаёт задачу реагирования
    description: >-
      При регистрации и проведении входящего документа система создаёт задачу
      реагирования без вызова LLM в транзакции документа.
    priority: must
    approval: approved
    source:
      - docs/raw_specification.md#4.4.1
    acceptance:
      - Проведённый входящий документ создаёт ровно одну задачу.
      - Задача содержит ДЛ, должность, тип триггера и источник.
      - Повторное проведение не создаёт дубль.
    design:
      - docs/implementation_plan.md#6.2
      - docs/implementation_plan.md#6.5
    implementation:
      - src/Configuration/Documents/ВходящийДокумент
      - src/Configuration/CommonModules/ОркестраторЗадач
    tests:
      - TEST-FR-008-01
      - TEST-FR-008-02
    test_files:
      - tests/1c/test_incoming_document.md
    status: planned
  - id: FR-009
    type: functional
    title: Входящее распоряжение и произвольное событие
    description: >-
      Распоряжение от вышестоящего ДЛ и произвольное событие регистрируются как
      документы и создают задачи с соответствующим типом триггера.
    priority: must
    approval: approved
    source:
      - docs/raw_specification.md#4.4.2
      - docs/raw_specification.md#4.4.3
    acceptance:
      - Распоряжение содержит автора, адресата и срок.
      - Произвольное событие содержит описание и адресата.
      - Оба документа создают задачу без дублей.
    design:
      - docs/implementation_plan.md#5.3
    implementation:
      - src/Configuration/Documents/РаспоряжениеВходящее
      - src/Configuration/Documents/ПроизвольноеСобытие
    tests:
      - TEST-FR-009-01
    test_files:
      - tests/1c/test_other_triggers.md
    status: planned
  - id: FR-010
    type: functional
    title: Реестр задач и машина состояний
    description: >-
      Задачи хранятся в регистре сведений с уникальным ID, состоянием, сроком,
      результатом, родительской задачей и признаком эскалации; переходы
      выполняются только через оркестратор.
    priority: must
    approval: approved
    source:
      - docs/raw_specification.md#4.5.1
    acceptance:
      - Все состояния из спецификации поддержаны.
      - Недопустимый переход отклоняется.
      - Каждый переход фиксируется в аудите.
    design:
      - docs/implementation_plan.md#5.4
      - docs/implementation_plan.md#6.1
    implementation:
      - src/Configuration/InformationRegisters/ЗадачиРеагирования
      - src/Configuration/CommonModules/ОркестраторЗадач
    tests:
      - TEST-FR-010-01
      - TEST-FR-010-02
    test_files:
      - tests/1c/test_task_state_machine.md
    status: planned
  - id: FR-011
    type: functional
    title: Реестр состояний плейсхолдеров
    description: >-
      Для каждой задачи ведётся состояние каждого плейсхолдера, включая источник,
      сформированный запрос, полученное значение и связанный запрос ожидания.
    priority: must
    approval: approved
    source:
      - docs/raw_specification.md#4.5.2
    acceptance:
      - Состояния плейсхолдеров соответствуют спецификации.
      - Значение и ошибка сохраняются.
      - Связь с листом ожидания однозначна.
    design:
      - docs/implementation_plan.md#5.4
    implementation:
      - src/Configuration/InformationRegisters/СостоянияПлейсхолдеров
    tests:
      - TEST-FR-011-01
    test_files:
      - tests/1c/test_placeholder_states.md
    status: planned
  - id: FR-012
    type: functional
    title: Лист ожидания и обработка ответов
    description: >-
      Запросы к внешним источникам регистрируются в листе ожидания; ответ
      заполняет плейсхолдер и возобновляет родительскую задачу.
    priority: must
    approval: approved
    source:
      - docs/raw_specification.md#4.6.1
      - docs/raw_specification.md#4.6.2
    acceptance:
      - Запрос имеет уникальный ID и срок ожидания.
      - Ответ идемпотентно заполняет плейсхолдер.
      - Родительская задача возобновляется.
    design:
      - docs/implementation_plan.md#5.4
      - docs/implementation_plan.md#6.4
    implementation:
      - src/Configuration/InformationRegisters/ЛистОжидания
      - src/Configuration/CommonModules/РаботаСЛистомОжидания
    tests:
      - TEST-FR-012-01
      - TEST-FR-012-02
    test_files:
      - tests/1c/test_waiting_list.md
    status: planned
  - id: FR-013
    type: functional
    title: Истечение срока ожидания
    description: >-
      Регламентное задание переводит просроченные запросы в состояние «СрокИстек»
      и создаёт триггер «ИстечениеСрокаОжидания».
    priority: must
    approval: approved
    source:
      - docs/raw_specification.md#4.6.2
    acceptance:
      - Просроченный запрос меняет состояние ровно один раз.
      - Создаётся триггер с ссылкой на запрос и задачу.
      - Непросроченные запросы не меняются.
    design:
      - docs/implementation_plan.md#6.4
    implementation:
      - src/Configuration/ScheduledJobs/ОбработкаЛистаОжидания
      - src/Configuration/CommonModules/РаботаСЛистомОжидания
    tests:
      - TEST-FR-013-01
    test_files:
      - tests/1c/test_waiting_deadline.md
    status: planned
  - id: FR-014
    type: functional
    title: Эскалация при срыве срока
    description: >-
      При просрочке задача переводится в эскалацию, формируется таймлайн,
      LLM анализирует причины, создаётся доклад о срыве сроков.
    priority: must
    approval: approved
    source:
      - docs/raw_specification.md#4.7.1
    acceptance:
      - Эскалация запускается для просроченной незавершённой задачи.
      - Доклад содержит причины и план мероприятий.
      - При сбое LLM доклад создаётся с детерминированным таймлайном.
    design:
      - docs/implementation_plan.md#6.4
      - docs/implementation_plan.md#8
    implementation:
      - src/Configuration/Documents/ДокладОСрывеСроков
      - src/Configuration/ScheduledJobs/ПроверкаСроковЗадач
      - src/Configuration/CommonModules/ОркестраторЗадач
    tests:
      - TEST-FR-014-01
      - TEST-FR-014-02
    test_files:
      - tests/1c/test_escalation.md
    status: planned
  - id: FR-015
    type: functional
    title: Интеграция с DeepSeek
    description: >-
      Общий модуль отправляет промпты в DeepSeek, поддерживает JSON-режим,
      таймауты, повторы, учёт токенов и возвращает структурированный результат.
    priority: must
    approval: approved
    source:
      - docs/raw_specification.md#4.8.1
      - docs/implementation_plan.md#8
    acceptance:
      - Промпт и параметры модели передаются в DeepSeek.
      - Ответ валидируется по ожидаемой схеме.
      - Ошибки и токены попадают в аудит.
    design:
      - docs/implementation_plan.md#8
    implementation:
      - src/Configuration/CommonModules/ИнтеграцияСLLM
    tests:
      - TEST-FR-015-01
      - TEST-FR-015-02
    test_files:
      - tests/1c/test_llm_client.md
    status: planned
  - id: FR-016
    type: functional
    title: Справочник промпт-шаблонов
    description: >-
      Промпты хранятся в справочнике с версией, моделью, температурой, лимитом
      токенов и ожидаемой JSON-схемой.
    priority: must
    approval: approved
    source:
      - docs/raw_specification.md#4.8.2
    acceptance:
      - Промпт можно изменить без изменения кода.
      - Версия и активность сохраняются.
      - Аудит ссылается на версию промпта.
    design:
      - docs/implementation_plan.md#5.2
      - docs/implementation_plan.md#8
    implementation:
      - src/Configuration/Catalogs/ПромптШаблоны
    tests:
      - TEST-FR-016-01
    test_files:
      - tests/1c/test_prompts.md
    status: planned
  - id: FR-017
    type: functional
    title: RAG-поиск шаблонов и обязанностей
    description: >-
      RAG-сервис индексирует шаблоны и должностные обязанности в Qdrant и
      возвращает релевантные фрагменты с метаданными и оценкой.
    priority: must
    approval: approved
    source:
      - docs/implementation_plan.md#7
    acceptance:
      - Поиск возвращает top-k с source_id и score.
      - Фильтры по типу источника и активности работают.
      - При недоступности RAG 1С использует fallback.
    design:
      - docs/implementation_plan.md#7.2
      - docs/implementation_plan.md#7.3
    implementation:
      - rag-service/src/rag_service/api/search.py
      - rag-service/src/rag_service/qdrant_store.py
      - src/Configuration/CommonModules/ИнтеграцияСRAG
    tests:
      - TEST-FR-017-01
      - TEST-FR-017-02
    test_files:
      - tests/rag/test_search.py
    status: planned
  - id: FR-018
    type: functional
    title: Синхронизация RAG-индекса из 1С
    description: >-
      1С передаёт изменённые шаблоны и обязанности в RAG-сервис, поддерживает
      дельта-индексацию, полную переиндексацию и удаление устаревших точек.
    priority: must
    approval: approved
    source:
      - docs/implementation_plan.md#7.5
    acceptance:
      - Изменённые записи индексируются повторно.
      - Полная переиндексация удаляет устаревшие точки.
      - Ошибка индексации не блокирует сохранение шаблона.
    design:
      - docs/implementation_plan.md#7.5
    implementation:
      - src/Configuration/CommonModules/ИнтеграцияСRAG
      - src/Configuration/ScheduledJobs/ИндексацияRAG
    tests:
      - TEST-FR-018-01
    test_files:
      - tests/rag/test_indexing.py
    status: planned
  - id: FR-019
    type: functional
    title: Выбор шаблона через RAG и LLM
    description: >-
      Оркестратор получает top-k кандидатов из RAG, передаёт их DeepSeek и
      выбирает шаблон; при низкой уверенности или ошибке используется ручной выбор.
    priority: must
    approval: approved
    source:
      - docs/implementation_plan.md#6.2
    acceptance:
      - LLM возвращает только ID из списка кандидатов.
      - Низкая уверенность переводит задачу в ручной выбор.
      - Недоступность RAG не роняет задачу.
    design:
      - docs/implementation_plan.md#6.2
      - docs/implementation_plan.md#8
    implementation:
      - src/Configuration/CommonModules/ОркестраторЗадач
      - src/Configuration/CommonModules/ИнтеграцияСRAG
    tests:
      - TEST-FR-019-01
      - TEST-FR-019-02
    test_files:
      - tests/1c/test_template_selection.md
    status: planned
  - id: FR-020
    type: functional
    title: Прямое заполнение и запросы к БД
    description: >-
      Прямые поля заполняются из источника триггера; запросы к БД выполняются по
      утверждённым шаблонам с параметрами, которые заполняет LLM.
    priority: must
    approval: approved
    source:
      - docs/raw_specification.md#4.9.1
      - docs/implementation_plan.md#2
    acceptance:
      - Прямое поле не вызывает LLM.
      - Произвольный текст запроса от LLM не исполняется.
      - Пустой или неоднозначный результат обрабатывается как ошибка.
    design:
      - docs/implementation_plan.md#6.3
    implementation:
      - src/Configuration/CommonModules/РазрешительПлейсхолдеров
    tests:
      - TEST-FR-020-01
      - TEST-FR-020-02
    test_files:
      - tests/1c/test_placeholder_resolution.md
    status: planned
  - id: FR-021
    type: functional
    title: Запрос к другому ДЛ
    description: >-
      Для источника «Другое ДЛ» создаётся запрос и запись листа ожидания,
      задача приостанавливается и возобновляется после ответа.
    priority: must
    approval: approved
    source:
      - docs/raw_specification.md#4.9.1
    acceptance:
      - Создаётся запрос с уникальным ID.
      - Задача переходит в «Ожидание».
      - Ответ возобновляет задачу без дублей.
    design:
      - docs/implementation_plan.md#6.3
      - docs/implementation_plan.md#6.4
    implementation:
      - src/Configuration/Documents/ЗапросКДЛ
      - src/Configuration/CommonModules/РаботаСЛистомОжидания
    tests:
      - TEST-FR-021-01
    test_files:
      - tests/1c/test_request_to_official.md
    status: planned
  - id: FR-022
    type: functional
    title: Расчетный сервис и внешний API
    description: >-
      Для расчетного сервиса рекурсивно разрешаются аргументы; для внешнего API
      используется схема источника, таймаут и валидация ответа.
    priority: should
    approval: approved
    source:
      - docs/raw_specification.md#4.9.1
