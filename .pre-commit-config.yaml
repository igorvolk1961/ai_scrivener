repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args:
          - --maxkb=512
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args:
          - --fix=lf
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --force-exclude
        language: system
        types_or:
          - python
          - pyi
        exclude: ^(agent-service|search-service)/
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types_or:
          - python
          - pyi
        exclude: ^(agent-service|search-service)/
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types_or:
          - python
          - pyi
        pass_filenames: false
      - id: mypy-rag
        name: mypy-rag
        entry: uv run --project rag-service mypy
        language: system
        files: ^rag-service/.*\.py$
        pass_filenames: false
      - id: ruff-agent
        name: ruff-agent
        entry: uv run --project agent-service ruff check agent-service/src agent-service/tests
        language: system
        files: ^agent-service/.*\.py$
        pass_filenames: false
      - id: mypy-agent
        name: mypy-agent
        entry: uv run --project agent-service mypy --config-file agent-service/pyproject.toml agent-service/src agent-service/tests
        language: system
        files: ^agent-service/.*\.py$
        pass_filenames: false
      - id: ruff-search
        name: ruff-search
        entry: uv run --project search-service ruff check search-service/src search-service/tests
        language: system
        files: ^search-service/.*\.py$
        pass_filenames: false
      - id: mypy-search
        name: mypy-search
        entry: uv run --project search-service mypy --config-file search-service/pyproject.toml search-service/src search-service/tests
        language: system
        files: ^search-service/.*\.py$
        pass_filenames: false
      - id: yamllint
        name: yamllint
        entry: uv run yamllint -c .yamllint.yaml
        language: system
        types:
          - yaml
      - id: config-schema
        name: config schema
        entry: uv run python -m scripts.config.validate
        language: system
        pass_filenames: false
      - id: requirements-traceability
        name: requirements traceability
        entry: uv run python -m scripts.requirements.check --check
        language: system
        files: ^(docs/requirements/|plans/implementation_plan.md|guides/|scripts/requirements/|config/)
        pass_filenames: false
      - id: no-unapproved-stubs
        name: no unapproved stubs
        entry: uv run python -m scripts.checks.no_stubs
        language: system
        files: \.(py|bsl|os)$
        pass_filenames: false
      - id: no-hardcoded-parameters
        name: no hardcoded numeric parameters
        entry: uv run python -m scripts.checks.no_hardcoded_parameters
        language: system
        files: \.(py|bsl|os)$
        pass_filenames: false
      - id: bsl-lint
        name: bsl language server
        entry: bash scripts/precommit/bsl_lint.sh
        language: system
        files: \.(bsl|os)$
        pass_filenames: true
      - id: extension-manifest
        name: extension manifest
        entry: uv run python -m scripts.git.check_extension_manifest
        language: system
        files: ^(src/Configuration/Configuration\.mdo|DT-INF/PROJECT\.PMF|src/.*\.mdo)$
        pass_filenames: false
      - id: forbid-1c-binaries
        name: forbid 1C binary artifacts
        entry: bash scripts/git/forbid_1c_binaries.sh
        language: system
        files: \.(cfe|cf|dt|CD|1CD)$
        pass_filenames: true
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types_or:
          - python
          - pyi
        pass_filenames: false
      - id: pytest-rag
        name: pytest-rag
        entry: uv run --project rag-service pytest -c rag-service/pyproject.toml rag-service/tests
        language: system
        files: ^rag-service/.*\.py$
        pass_filenames: false
      - id: pytest-agent
        name: pytest-agent
        entry: uv run --project agent-service pytest -c agent-service/pyproject.toml agent-service/tests
        language: system
        files: ^agent-service/.*\.py$
        pass_filenames: false
      - id: pytest-search
        name: pytest-search
        entry: uv run --project search-service pytest -c search-service/pyproject.toml search-service/tests
        language: system
        files: ^search-service/.*\.py$
        pass_filenames: false
