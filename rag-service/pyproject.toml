[project]
name = "ai-scrivener-rag"
version = "0.1.0"
description = "Stateless RAG service for ai_scrivener"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "fastembed>=0.7,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0,<7",
  "qdrant-client>=1.13,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
indexer = [
  "pdfplumber>=0.11,<1",
  "pypdfium2>=4,<6",
  "python-docx>=1.1,<2",
  "trafilatura>=2,<3",
]
ocr-paddle = [
  "paddleocr>=3.7,<4",
  "paddlepaddle>=3.3,<4",
]

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pdfplumber>=0.11,<1",
  "pytest>=8.3",
  "python-docx>=1.1,<2",
  "respx>=0.22",
  "ruff>=0.9",
  "trafilatura>=2,<3",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_service", "src/rag_indexer"]

[tool.uv]
python-preference = "only-system"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF", "PLR2004"]
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"src/rag_service/__main__.py" = ["S104"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
